name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: "22.12.0" }
          - { os: ubuntu-latest, node: "24.22.0" }
          - { os: windows-latest, node: "24.22.0" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      # Node 22.12's bundled Corepack ships stale npm registry signing keys and cannot
      # fetch pnpm ("Cannot find matching keyid"). Pin a current Corepack first.
      - run: npm install -g corepack@0.36.0
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  # macOS minutes are billed at a large multiplier on private repositories.
  # Runs on main, manual dispatch, or pull requests labelled `ci:full`.
  macos:
    name: macos-latest / Node 24.22.0
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.22.0"
      - run: npm install -g corepack@0.36.0
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
