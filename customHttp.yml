# Response headers for AWS Amplify Hosting. Redeploy after editing; values here override headers
# set in the Amplify console. https://docs.aws.amazon.com/amplify/latest/userguide/monorepo-custom-headers.html
#
# Astro emits the hash-based script-src and style-src policy as a <meta> tag on every page
# (astro.config.mjs). Browsers enforce both policies, so this header must not add default-src,
# script-src or style-src: without the per-build hashes they would block Astro's inline scripts.
# Every directive it does set must allow at least what the <meta> policy allows (Starlight needs
# data: images). frame-ancestors only works as a header, never in <meta>.
applications:
  - appRoot: apps/site
    customHeaders:
      - pattern: "**/*"
        headers:
          - key: Content-Security-Policy
            value: >-
              connect-src 'self' https://app.loops.so; img-src 'self' data:; font-src 'self';
              media-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none';
              base-uri 'self'; form-action 'self'; frame-ancestors 'none'
          - key: Referrer-Policy
            value: strict-origin-when-cross-origin
          - key: X-Content-Type-Options
            value: nosniff
          - key: Permissions-Policy
            value: camera=(), microphone=(), geolocation=(), payment=(), usb=()
          - key: Strict-Transport-Security
            value: max-age=31536000; includeSubDomains
          - key: X-Frame-Options
            value: DENY
